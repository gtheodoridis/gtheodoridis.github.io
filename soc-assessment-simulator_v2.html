            reason: 'AMBIGUOUS CASE - Multiple valid approaches exist: (1) CLOSE as legitimate admin activity if user context + internal IP + work hours suggest normal operations, (2) REQUEST MORE INFO to check VirusTotal hash and confirm with user before taking action, (3) ISOLATE if you assess the risk of a compromised admin account outweighs operational disruption. The "correct" answer depends on risk tolerance and requires justification of reasoning, not just action selection.',

          },

            event_id: 'EDR-2024-002891',
            timestamp: '2024-02-11T10:15:09.442Z',
            hostname: 'CORP-ADMIN-01',
            user: 'tanderson@company.com',
            process: 'powershell.exe',
            process_path: 'C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe',
            parent_process: 'explorer.exe',
            command_line: 'powershell.exe -EncodedCommand JABjAGwAaQBlAG4AdAAgAD0AIABOAGUAdwAtAE8AYgBqAGUAYwB0ACAAUwB5AHMAdABlAG0ALgBOAGUAdAAuAFcAZQBiAEMAbABpAGUAbgB0ADsAJABjAGwAaQBlAG4AdAAuAEQAbwB3AG4AbABvAGEAZABGAGkAbABlACgAIgBoAHQAdABwADoALwAvADEAOQAyAC4AMQA2ADgALgAxAC4AMQAwADAALwB0AG8AbwBsAHMALgBlAHgAZQAiACwAIgBDADoAXABUAGUAbQBwAFwAdABvAG8AbABzAC4AZQB4AGUAIgApAA==',
            network_connection: '192.168.1.100:80',
            severity: 'High',
            confidence: 65
          }
        }
      ]);

      const [toast, setToast] = useState(null);
      const [timers, setTimers] = useState({});
      const [alertNotes, setAlertNotes] = useState({});

      useEffect(() => {
        if (!assessmentStarted) return;
        
        const interval = setInterval(() => {
          setAssessmentTime(prev => {
            if (prev <= 0) {
              clearInterval(interval);
              return 0;
            }
            return prev - 1;
          });
          
          setTimers(prev => {
            const newTimers = { ...prev };
            alerts.forEach(alert => {
              if (alert.status === 'Open' && newTimers[alert.id] > 0) {
                newTimers[alert.id] = (newTimers[alert.id] || alert.sla) - 1;
              }
            });
            return newTimers;
          });
        }, 1000);

        return () => clearInterval(interval);
      }, [alerts, assessmentStarted]);

      useEffect(() => {
        const initialTimers = {};
        alerts.forEach(alert => {
          initialTimers[alert.id] = alert.sla;
        });
        setTimers(initialTimers);
      }, []);

      const getSeverityColor = (severity) => {
        const colors = {
          Critical: 'bg-red-900 border-red-500 text-red-200',
          High: 'bg-orange-900 border-orange-500 text-orange-200',
          Medium: 'bg-yellow-900 border-yellow-600 text-yellow-200',
          Low: 'bg-blue-900 border-blue-500 text-blue-200'
        };
        return colors[severity] || 'bg-gray-800';
      };

      const getSeverityBadge = (severity) => {
        const colors = {
          Critical: 'bg-red-600 text-white',
          High: 'bg-orange-600 text-white',
          Medium: 'bg-yellow-600 text-black',
          Low: 'bg-blue-600 text-white'
        };
        return colors[severity] || 'bg-gray-600';
      };

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      const handleAction = (action, alertId) => {
        const alert = alerts.find(a => a.id === alertId);
        const isCorrectAction = alert.correctAction === action;
        const currentTime = 900 - assessmentTime;
        
        // Track first action time
        if (!telemetry.firstActionTime) {
          setTelemetry(prev => ({
            ...prev,
            firstActionTime: currentTime
          }));
        }
        
        // Track resolution sequence
        setTelemetry(prev => ({
          ...prev,
          resolutionSequence: [...prev.resolutionSequence, { alertId, action, time: currentTime }]
        }));
        
        // Mark alert as resolved regardless of correctness (no feedback to candidate)
        setAlerts(alerts.map(a => 
          a.id === alertId ? { ...a, status: 'Resolved', actionTaken: action, wasCorrect: isCorrectAction, resolutionTime: currentTime } : a
        ));
        
        // Generic success message without revealing correctness
        if (action === 'isolate') {
          showToast(`Host isolated - Alert resolved`, 'success');
        } else if (action === 'reset') {
          showToast(`Password reset initiated - Alert resolved`, 'success');
        } else if (action === 'close') {
          showToast(`Alert closed and documented`, 'success');
        }
        
        setTimeout(() => setSelectedAlert(null), 1500);
      };
      
      const handleAlertSelection = (alert) => {
        const currentTime = 900 - assessmentTime;
        
        // Track first alert opened
        if (!telemetry.firstAlertOpenedId) {
          setTelemetry(prev => ({
            ...prev,
            firstAlertOpenedId: alert.id,
            firstAlertOpenedTime: currentTime
          }));
        }
        
        // Track alerts viewed before first action
        if (!telemetry.firstActionTime && !telemetry.alertsViewedBeforeFirstAction.includes(alert.id)) {
          setTelemetry(prev => ({
            ...prev,
            alertsViewedBeforeFirstAction: [...prev.alertsViewedBeforeFirstAction, alert.id]
          }));
        }
        
        // Track context switches
        if (selectedAlert && selectedAlert.id !== alert.id) {
          setTelemetry(prev => ({
            ...prev,
            contextSwitches: prev.contextSwitches + 1
          }));
        }
        
        // Start tracking dwell time
        if (selectedAlert) {
          const dwellTime = currentTime - (telemetry.dwellTimes[selectedAlert.id]?.start || currentTime);
          setTelemetry(prev => ({
            ...prev,
            dwellTimes: {
              ...prev.dwellTimes,
              [selectedAlert.id]: {
                ...prev.dwellTimes[selectedAlert.id],
                total: (prev.dwellTimes[selectedAlert.id]?.total || 0) + dwellTime
              }
            }
          }));
        }
        
        setTelemetry(prev => ({
          ...prev,
          dwellTimes: {
            ...prev.dwellTimes,
            [alert.id]: {
              ...prev.dwellTimes[alert.id],
              start: currentTime
            }
          }
        }));
        
        setSelectedAlert(alert);
      };
      
      const requestMoreInfo = (alertId) => {
        setShowExtendedLogs(prev => ({
          ...prev,
          [alertId]: true
        }));
        
        setTelemetry(prev => ({
          ...prev,
          evidenceRequests: {
            ...prev.evidenceRequests,
            [alertId]: true
          }
        }));
        
        showToast('Extended forensic data loaded', 'success');
      };

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      };

      const updateAlertNotes = (alertId, field, value) => {
        setAlertNotes(prev => ({
          ...prev,
          [alertId]: {
            ...prev[alertId],
            [field]: value
          }
        }));
      };

      const exportAssessment = () => {
        // Calculate behavioral scores
        const criticalAlertFirst = telemetry.firstAlertOpenedId === 1;
        const avgDwellTime = Object.values(telemetry.dwellTimes).reduce((sum, dt) => sum + (dt.total || 0), 0) / alerts.length;
        const criticalAlertsResolved = alerts.filter(a => a.severity === 'Critical' && a.status === 'Resolved').length;
        const lowAlertsBeforeCritical = telemetry.resolutionSequence.findIndex(r => r.alertId === 1) > 
                                         telemetry.resolutionSequence.findIndex(r => alerts.find(a => a.id === r.alertId)?.severity === 'Low');
        
        const behavioralScore = {
          prioritization: criticalAlertFirst ? 10 : (telemetry.firstAlertOpenedId <= 3 ? 5 : 0),
          efficiency: telemetry.contextSwitches < 10 ? 10 : (telemetry.contextSwitches < 20 ? 5 : 0),
          thoroughness: Object.keys(telemetry.evidenceRequests).length >= 2 ? 10 : (Object.keys(telemetry.evidenceRequests).length >= 1 ? 5 : 0),
          decisionQuality: alerts.filter(a => a.wasCorrect).length * 10,
          penalties: lowAlertsBeforeCritical ? -10 : 0
        };
        
        const totalBehavioralScore = Object.values(behavioralScore).reduce((a, b) => a + b, 0);
        
        // Generate verdict
        let verdict = '';
        let profile = '';
        if (totalBehavioralScore >= 40 && alerts.filter(a => a.wasCorrect).length >= 5) {
          verdict = 'Strong Hire - Senior Level';
          profile = 'Excellent prioritization, thorough investigation, sound decision-making';
        } else if (totalBehavioralScore >= 25 && alerts.filter(a => a.wasCorrect).length >= 4) {
          verdict = 'Hire - Mid Level';
          profile = 'Good fundamentals, could benefit from more experience';
        } else if (totalBehavioralScore >= 15 && alerts.filter(a => a.wasCorrect).length >= 3) {
          verdict = 'Consider - Junior Level';
          profile = 'Shows promise but needs training on prioritization and investigation';
        } else {
          verdict = 'Do Not Hire';
          profile = 'Insufficient security fundamentals or poor prioritization';
        }
        
        // Teaching moments
        const teachingMoments = [];
        if (!criticalAlertFirst) {
          teachingMoments.push(`Started with ${alerts.find(a => a.id === telemetry.firstAlertOpenedId)?.severity || 'Unknown'} severity alert instead of Critical. Always triage by severity first.`);
        }
        if (telemetry.contextSwitches > 15) {
          teachingMoments.push(`${telemetry.contextSwitches} context switches detected. This suggests scattered focus. Try to fully investigate and resolve one alert before moving to the next.`);
        }
        if (Object.keys(telemetry.evidenceRequests).length === 0) {
          teachingMoments.push('Never requested extended logs. Real investigations require deep-diving into evidence, not just surface-level analysis.');
        }
        if (lowAlertsBeforeCritical) {
          teachingMoments.push('Resolved Low severity alerts while Critical alerts remained open. This is a major prioritization failure in a real SOC.');
        }
        
        const assessment = {
          timestamp: new Date().toISOString(),
          totalTime: '15:00',
          timeUsed: formatTime(900 - assessmentTime),
          timeRemaining: formatTime(assessmentTime),
          
          telemetry: {
            firstAlertOpened: {
              id: telemetry.firstAlertOpenedId,
              title: alerts.find(a => a.id === telemetry.firstAlertOpenedId)?.title,
              severity: alerts.find(a => a.id === telemetry.firstAlertOpenedId)?.severity,
              timeFromStart: telemetry.firstAlertOpenedTime
            },
            timeToFirstAction: telemetry.firstActionTime,
            alertsReviewedBeforeActing: telemetry.alertsViewedBeforeFirstAction.length,
            contextSwitches: telemetry.contextSwitches,
            resolutionSequence: telemetry.resolutionSequence.map(r => ({
              ...r,
              alert: alerts.find(a => a.id === r.alertId)?.title,
              severity: alerts.find(a => a.id === r.alertId)?.severity
            })),
            evidenceRequestsMade: Object.keys(telemetry.evidenceRequests).length,
            dwellTimes: Object.entries(telemetry.dwellTimes).map(([id, data]) => ({
              alert: alerts.find(a => a.id === parseInt(id))?.title,
              totalSeconds: Math.round(data.total || 0)
            }))
          },
          
          alerts: alerts.map(alert => ({
            id: alert.id,
            title: alert.title,
            severity: alert.severity,
            status: alert.status,
            actionTaken: alert.actionTaken || 'None',
            correctAction: alert.correctAction,
            wasCorrect: alert.wasCorrect || false,
            isAmbiguous: alert.isAmbiguous || false,
            isFalsePositive: alert.isFalsePositive || false,
            requestedExtendedLogs: telemetry.evidenceRequests[alert.id] || false,
            resolutionTime: alert.resolutionTime,
            candidateNotes: alertNotes[alert.id] || {},
            officialWriteUp: alert.officialWriteUp
          })),
          
          scoring: {
            total: alerts.length,
            correct: alerts.filter(a => a.wasCorrect).length,
            incorrect: alerts.filter(a => a.status === 'Resolved' && !a.wasCorrect).length,
            notAttempted: alerts.filter(a => a.status === 'Open').length,
            percentage: Math.round((alerts.filter(a => a.wasCorrect).length / alerts.length) * 100),
            behavioralScore: behavioralScore,
            totalBehavioralScore: totalBehavioralScore
          },
          
          verdict: {
            decision: verdict,
            profile: profile,
            teachingMoments: teachingMoments
          }
        };

        const blob = new Blob([JSON.stringify(assessment, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `soc-assessment-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
        
        setAssessmentComplete(true);
        showToast('Assessment exported successfully!', 'success');
      };

      const startAssessment = () => {
        setShowInstructions(true);
      };

      const beginAssessment = () => {
        setShowInstructions(false);
        setAssessmentStarted(true);
      };

      return (
        <div className="flex h-screen bg-gray-950 text-gray-100 font-mono">
          {/* Start Screen */}
          {!assessmentStarted && !showInstructions && (
            <div className="flex-1 flex items-center justify-center bg-gradient-to-br from-gray-950 via-gray-900 to-gray-950">
              <div className="text-center">
                <Shield size={120} className="mx-auto mb-8 text-cyan-400" />
                <h1 className="text-5xl font-bold text-white mb-4">SOC Analyst Assessment</h1>

                <button

          {/* Instructions Modal */}
          {showInstructions && (
            <div className="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50">

                    <li>Document your findings in the "Case Documentation" section</li>

                  <span>{toast.message}</span>

              {/* Sidebar - Alert Queue */}
              <div className="w-96 bg-gray-900 border-r border-gray-700 overflow-y-auto">

                    <h1 className="text-xl font-bold text-cyan-400 flex items-center gap-2">
                      <Shield size={24} className="text-cyan-400" />
                      SOC ANALYST ASSESSMENT

                    <button

                      className="w-8 h-8 bg-cyan-600 hover:bg-cyan-700 rounded-full flex items-center justify-center font-bold text-lg transition-colors"
                      title="Show Instructions"
                    >
                      ?
                    </button>
                  </div>
                  <p className="text-xs text-gray-400">Active Alerts: {alerts.filter(a => a.status === 'Open').length}</p>
                  <div className="mt-2 flex items-center gap-2">
                    <Clock size={16} className="text-cyan-400" />
                    <span className={`font-bold ${assessmentTime < 300 ? 'text-red-400' : 'text-cyan-400'}`}>
                      Time Remaining: {formatTime(assessmentTime)}

            <div className="p-2">

                const isResolved = alert.status === 'Resolved';
                
                return (
                  <div

                    onClick={() => handleAlertSelection(alert)}
                    className={`p-3 mb-2 rounded border-l-4 cursor-pointer transition-all ${
                      isResolved ? 'bg-gray-800 border-gray-600 text-gray-400 opacity-60' :
                      getSeverityColor(alert.severity)
                    } ${selectedAlert?.id === alert.id ? 'ring-2 ring-cyan-500' : ''}`}
                  >
                    <div className="flex items-start justify-between mb-2">
                      <span className={`px-2 py-1 rounded text-xs font-bold ${
                        isResolved ? 'bg-gray-700 text-gray-300' :
                        getSeverityBadge(alert.severity)

                        {isResolved ? 'RESOLVED' : alert.severity}
                      </span>
                      <Icon size={18} className="text-gray-400" />
                    </div>
                    <h3 className="text-sm font-semibold mb-1">{alert.title}</h3>
                    <p className="text-xs text-gray-400 mb-2">{alert.source} • {alert.timestamp}</p>
                    <div className="flex items-center gap-2 text-xs">
                      <Clock size={12} className="text-gray-500" />
                      <span className={timers[alert.id] < 300 ? 'text-red-400' : 'text-gray-400'}>
                        SLA: {formatTime(timers[alert.id] || alert.sla)}

              })}
            </div>
          </div>

          <div className="flex-1 overflow-y-auto">
            {selectedAlert ? (

                      <p className="text-gray-400">{selectedAlert.description}</p>

                    <div>

                      <p className="text-white">{selectedAlert.source}</p>

                    <div>
                      <span className="text-gray-500">SLA Countdown:</span>
                      <p className={`font-bold ${timers[selectedAlert.id] < 300 ? 'text-red-400' : 'text-green-400'}`}>
                        {formatTime(timers[selectedAlert.id] || selectedAlert.sla)}
                      </p>
                    </div>
                  </div>

                {/* Action Buttons */}
                <div className="flex gap-4 mb-6">
                  <button

                  <button
                    onClick={() => handleAction('reset', selectedAlert.id)}

                  >
                    🔑 Reset User Password
                  </button>
                  <button

                  {selectedAlert.hasExtendedLogs && !showExtendedLogs[selectedAlert.id] && (

                {/* Two Column Layout: Logs and Write-up */}
                <div className="grid grid-cols-2 gap-6">

{JSON.stringify(selectedAlert.logs, null, 2)}

{JSON.stringify(selectedAlert.extendedLogs, null, 2)}

                        <input
                          type="text"
                          value={selectedAlert.severity}
                          disabled
                          className="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm text-gray-400"
                        />
                      </div>

                      {/* Investigation (Free text) */}
                      <div>
                        <label className="block text-sm font-semibold text-gray-300 mb-1">Investigation:</label>
                        <textarea
                          value={alertNotes[selectedAlert.id]?.investigation || ''}
                          onChange={(e) => updateAlertNotes(selectedAlert.id, 'investigation', e.target.value)}
                          placeholder="What happened? When? Who was affected? How did it occur? What evidence did you find?"
                          className="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm text-white h-32 resize-none focus:outline-none focus:ring-2 focus:ring-cyan-500"
                        />
                      </div>

                      {/* Reason for actions (Free text) */}
                      <div>
                        <label className="block text-sm font-semibold text-gray-300 mb-1">Reason for actions taken:</label>
                        <textarea
                          value={alertNotes[selectedAlert.id]?.reason || ''}
                          onChange={(e) => updateAlertNotes(selectedAlert.id, 'reason', e.target.value)}
                          placeholder="Why did you choose this action? What was your rationale?"
                          className="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm text-white h-24 resize-none focus:outline-none focus:ring-2 focus:ring-cyan-500"
                        />
                      </div>

                      {/* Outcome (Auto-filled based on action) */}
                      <div>
                        <label className="block text-sm font-semibold text-gray-300 mb-1">Outcome:</label>
                        <input
                          type="text"
                          value={
                            selectedAlert.status === 'Resolved' ? 'Alert Resolved - Action Taken' :
                            'Pending Action'
                          }
                          disabled
                          className={`w-full border rounded px-3 py-2 text-sm font-semibold ${
                            selectedAlert.status === 'Resolved' ? 'bg-gray-800 border-gray-600 text-gray-300' :
                            'bg-gray-800 border-gray-600 text-gray-400'
                          }`}
                        />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            ) : (
              <div className="flex flex-col items-center justify-center h-full p-8 overflow-y-auto">
                {!assessmentComplete ? (
                  <>
                    <div className="text-center text-gray-500 mb-8">
                      <Shield size={64} className="mx-auto mb-4 opacity-20" />
                      <p className="text-xl">Select an alert to view details</p>
                      <p className="text-sm mt-2">Click on any alert from the queue to begin investigation</p>
                    </div>
                    
                    {/* Submit Assessment Button */}
                    <button
                      onClick={exportAssessment}
                      className="px-8 py-4 bg-cyan-600 hover:bg-cyan-700 rounded-lg font-bold text-lg transition-colors flex items-center gap-2"
                    >
                      📊 Submit Assessment & Export Results
                    </button>
                  </>
                ) : (
                  /* Interviewer Dashboard */
                  <div className="w-full max-w-6xl">
                    <div className="bg-gray-900 rounded-lg border-2 border-cyan-500 p-8 mb-6">
                      <h2 className="text-3xl font-bold text-cyan-400 mb-2">Assessment Complete</h2>
                      <p className="text-gray-400">Results exported successfully. Review summary below.</p>
                    </div>

                    {/* Verdict Card */}
                    <div className={`rounded-lg border-2 p-6 mb-6 ${
                      alerts.filter(a => a.wasCorrect).length >= 5 ? 'bg-green-900 border-green-500' :
                      alerts.filter(a => a.wasCorrect).length >= 3 ? 'bg-yellow-900 border-yellow-600' :
                      'bg-red-900 border-red-500'
                    }`}>
                      <h3 className="text-2xl font-bold text-white mb-2">
                        {alerts.filter(a => a.wasCorrect).length >= 5 ? '✓ Strong Hire - Senior Level' :
                         alerts.filter(a => a.wasCorrect).length >= 4 ? '✓ Hire - Mid Level' :
                         alerts.filter(a => a.wasCorrect).length >= 3 ? '⚠ Consider - Junior Level' :
                         '✗ Do Not Hire'}
                      </h3>
                      <p className="text-lg">
                        {alerts.filter(a => a.wasCorrect).length >= 5 ? 'Excellent prioritization, thorough investigation, sound decision-making' :
                         alerts.filter(a => a.wasCorrect).length >= 4 ? 'Good fundamentals, could benefit from more experience' :
                         alerts.filter(a => a.wasCorrect).length >= 3 ? 'Shows promise but needs training on prioritization and investigation' :
                         'Insufficient security fundamentals or poor prioritization'}
                      </p>
                    </div>

                    {/* Score Summary */}
                    <div className="grid grid-cols-4 gap-4 mb-6">
                      <div className="bg-gray-900 border border-gray-700 rounded-lg p-4 text-center">
                        <div className="text-3xl font-bold text-green-400">{alerts.filter(a => a.wasCorrect).length}</div>
                        <div className="text-sm text-gray-400">Correct</div>
                      </div>
                      <div className="bg-gray-900 border border-gray-700 rounded-lg p-4 text-center">
                        <div className="text-3xl font-bold text-red-400">{alerts.filter(a => a.status === 'Resolved' && !a.wasCorrect).length}</div>
                        <div className="text-sm text-gray-400">Incorrect</div>
                      </div>
                      <div className="bg-gray-900 border border-gray-700 rounded-lg p-4 text-center">
                        <div className="text-3xl font-bold text-gray-400">{alerts.filter(a => a.status === 'Open').length}</div>
                        <div className="text-sm text-gray-400">Not Attempted</div>
                      </div>
                      <div className="bg-gray-900 border border-gray-700 rounded-lg p-4 text-center">
                        <div className="text-3xl font-bold text-cyan-400">{telemetry.contextSwitches}</div>
                        <div className="text-sm text-gray-400">Context Switches</div>
                      </div>
                    </div>

                    {/* Timeline */}
                    <div className="bg-gray-900 rounded-lg border border-gray-700 p-6 mb-6">
                      <h3 className="text-xl font-bold text-cyan-400 mb-4">Resolution Timeline</h3>
                      <div className="space-y-2">
                        {telemetry.resolutionSequence.map((item, idx) => {
                          const alert = alerts.find(a => a.id === item.alertId);
                          return (
                            <div key={idx} className="flex items-center gap-4 p-3 bg-gray-800 rounded">
                              <span className="text-gray-500 font-mono">{formatTime(900 - item.time)}</span>
                              <span className={`px-2 py-1 rounded text-xs font-bold ${getSeverityBadge(alert.severity)}`}>
                                {alert.severity}
                              </span>
                              <span className="flex-1">{alert.title}</span>
                              <span className={`px-2 py-1 rounded text-xs ${
                                alert.wasCorrect ? 'bg-green-600' : 'bg-red-600'
                              }`}>
                                {item.action.toUpperCase()} {alert.wasCorrect ? '✓' : '✗'}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    {/* Teaching Moments */}
                    <div className="bg-orange-900 border border-orange-600 rounded-lg p-6 mb-6">
                      <h3 className="text-xl font-bold text-orange-200 mb-4">📚 Teaching Moments</h3>
                      <ul className="space-y-2">
                        {telemetry.firstAlertOpenedId !== 1 && (
                          <li className="text-orange-100">
                            • Started with {alerts.find(a => a.id === telemetry.firstAlertOpenedId)?.severity} severity alert instead of Critical. Always triage by severity first.
                          </li>
                        )}
                        {telemetry.contextSwitches > 15 && (
                          <li className="text-orange-100">
                            • {telemetry.contextSwitches} context switches detected. This suggests scattered focus. Try to fully investigate and resolve one alert before moving to the next.
                          </li>
                        )}
                        {Object.keys(telemetry.evidenceRequests).length === 0 && (
                          <li className="text-orange-100">
                            • Never requested extended logs. Real investigations require deep-diving into evidence, not just surface-level analysis.
                          </li>
                        )}
                        {telemetry.resolutionSequence.length > 0 && 
                         telemetry.resolutionSequence.findIndex(r => r.alertId === 1) > 
                         telemetry.resolutionSequence.findIndex(r => alerts.find(a => a.id === r.alertId)?.severity === 'Low') && (
                          <li className="text-orange-100">
                            • Resolved Low severity alerts while Critical alerts remained open. This is a major prioritization failure in a real SOC.
                          </li>
                        )}
                        {telemetry.resolutionSequence.length === 0 && (
                          <li className="text-orange-100">
                            • No alerts were resolved. This suggests hesitation or inability to make decisions under pressure.
                          </li>
                        )}
                      </ul>
                    </div>

                    {/* Key Metrics */}
                    <div className="bg-gray-900 rounded-lg border border-gray-700 p-6">
                      <h3 className="text-xl font-bold text-cyan-400 mb-4">📊 Key Metrics</h3>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <span className="text-gray-400">First Alert Opened:</span>
                          <p className="font-semibold">{alerts.find(a => a.id === telemetry.firstAlertOpenedId)?.title || 'None'}</p>
                        </div>
                        <div>
                          <span className="text-gray-400">Time to First Action:</span>
                          <p className="font-semibold">{telemetry.firstActionTime ? formatTime(telemetry.firstActionTime) : 'No action taken'}</p>
                        </div>
                        <div>
                          <span className="text-gray-400">Alerts Reviewed Before Acting:</span>
                          <p className="font-semibold">{telemetry.alertsViewedBeforeFirstAction.length} / {alerts.length}</p>
                        </div>
                        <div>
                          <span className="text-gray-400">Extended Logs Requested:</span>
                          <p className="font-semibold">{Object.keys(telemetry.evidenceRequests).length} times</p>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
            </>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SOCAnalystSimulator />);
  </script>
</body>
</html>
