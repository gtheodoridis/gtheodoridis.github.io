<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOC Analyst Assessment Simulator</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Courier New', monospace;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Lucide React icons as inline SVG components
    const AlertTriangle = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    );

    const Shield = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    );

    const Mail = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
      </svg>
    );

    const Globe = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="12" r="10"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
    );

    const Lock = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    );

    const Database = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <ellipse cx="12" cy="5" rx="9" ry="3"/>
        <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
      </svg>
    );

    const Clock = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
    );

    const CheckCircle = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
    );

    const XCircle = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="12" r="10"/>
        <line x1="15" y1="9" x2="9" y2="15"/>
        <line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
    );

    const BookOpen = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
    );

    const MessageSquare = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    );

    const Activity = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
    );

    const Code = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polyline points="16 18 22 12 16 6" />
        <polyline points="8 6 2 12 8 18" />
      </svg>
    );

    const Terminal = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polyline points="4 17 10 11 4 5"/>
        <line x1="12" y1="19" x2="20" y2="19"/>
      </svg>
    );

    const ShieldAlert = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    );

    const Copy = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
    );

    // Fake Threat Intel Database
    const threatIntelDB = {
      ips: {
        '185.220.101.47': { reputation: 'Malicious', score: 100, isp: 'DigitalOcean', country: 'Netherlands', tags: ['C2', 'RedLine Stealer'] },
        '45.142.214.98': { reputation: 'Malicious', score: 95, isp: 'Selectel', country: 'Russia', tags: ['Brute Force', 'VPN'] },
        '103.224.182.251': { reputation: 'Malicious', score: 88, isp: 'Abuse-Resistant Hosting', country: 'Panama', tags: ['Phishing', 'Spam'] },
        '81.107.84.22': { reputation: 'Safe', score: 0, isp: 'Cisco Systems', country: 'UK', tags: ['Corporate VPN', 'Allowlisted'] },
        '128.199.248.91': { reputation: 'Safe', score: 0, isp: 'Cisco Systems', country: 'Singapore', tags: ['Corporate VPN', 'Allowlisted'] },
        '192.168.1.100': { reputation: 'Safe', score: 0, isp: 'Internal Network', country: 'Local', tags: ['Private IP', 'IT Infrastructure'] }
      },
      hashes: {
        'a3f8d2c1b4e9f7a2c8d3e1f4a9b2c7d8e3f1a4b9c2d7e8f3a1b4c9d2e7f8a3b1': { verdict: 'Malicious', score: '58/72', family: 'RedLine.Stealer', tags: ['Trojan', 'Spyware', 'Credential Stealer'] }
      }
    };

    // Tool Modal Component
    const ToolModal = ({ activeTool, setActiveTool, onLogActivity }) => {
      const [input, setInput] = useState('');
      const [result, setResult] = useState(null);

      useEffect(() => { setInput(''); setResult(null); }, [activeTool]);

      if (!activeTool) return null;

      const handleSearch = () => {
        if (activeTool === 'ip') {
          const data = threatIntelDB.ips[input.trim()];
          setResult(data || { reputation: 'Unknown', score: 0, tags: ['No records found'] });
          onLogActivity('Tool Used', `Checked IP Reputation: ${input.trim()} (${data ? 'Found' : 'No Record'})`);
        } else if (activeTool === 'hash') {
          const data = threatIntelDB.hashes[input.trim()];
          setResult(data || { verdict: 'Unknown', score: '0/0', tags: ['Hash not found in database'] });
          onLogActivity('Tool Used', `Checked File Hash: ${input.trim()} (${data ? 'Found' : 'No Record'})`);
        } else if (activeTool === 'decoder') {
          try {
            setResult({ decoded: atob(input.trim()) });
            onLogActivity('Tool Used', `Decoded Base64 String`);
          } catch (e) {
            setResult({ error: 'Invalid Base64 string' });
          }
        } else if (activeTool === 'defang') {
          const defanged = input.replace(/\./g, '[.]').replace(/http/g, 'hxxp').replace(/@/g, '[at]');
          setResult({ defanged: defanged });
          onLogActivity('Tool Used', `Defanged IOC: ${input.trim()}`);
        }
      };

      return (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" onClick={() => setActiveTool(null)}>
          <div className="bg-gray-900 border-2 border-cyan-500 rounded-lg p-6 w-full max-w-lg" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-xl font-bold text-cyan-400">
                {activeTool === 'ip' && 'IP Reputation Check'}
                {activeTool === 'hash' && 'Hash Lookup'}
                {activeTool === 'decoder' && 'Base64 Decoder'}
                {activeTool === 'defang' && 'IOC Defanger'}
              </h3>
              <button onClick={() => setActiveTool(null)} className="text-gray-400 hover:text-white">✕</button>
            </div>
            <div className="flex gap-2 mb-4">
              <input 
                type="text" 
                value={input} 
                onChange={(e) => setInput(e.target.value)} 
                className="flex-1 bg-gray-800 border border-gray-600 rounded px-3 py-2 text-white font-mono text-sm" 
                placeholder={activeTool === 'ip' ? '1.1.1.1' : activeTool === 'hash' ? 'SHA256 Hash' : activeTool === 'decoder' ? 'Base64 String' : 'URL/IP to Defang'} 
              />
              <button onClick={handleSearch} className="px-4 py-2 bg-cyan-600 hover:bg-cyan-700 rounded font-bold">Check</button>
            </div>
            {result && (
              <div className="bg-black rounded p-4 border border-gray-700">
                {activeTool === 'ip' && (
                  <div>
                    <div className="flex justify-between mb-2">
                      <span className={`font-bold ${result.reputation === 'Malicious' ? 'text-red-500' : 'text-green-500'}`}>{result.reputation.toUpperCase()}</span>
                      <span className="text-gray-400">Score: {result.score}</span>
                    </div>
                    <p className="text-sm text-gray-300">ISP: {result.isp} | Country: {result.country}</p>
                  </div>
                )}
                {activeTool === 'hash' && (
                  <div>
                    <div className="flex justify-between mb-2">
                      <span className={`font-bold ${result.verdict === 'Malicious' ? 'text-red-500' : 'text-gray-400'}`}>{result.verdict}</span>
                      <span className="text-gray-400">Detections: {result.score}</span>
                    </div>
                    {result.family && <p className="text-sm text-red-400">Family: {result.family}</p>}
                  </div>
                )}
                {activeTool === 'decoder' && (
                  <div>
                    <p className="text-xs text-gray-500 mb-1">Decoded Output:</p>
                    <pre className="text-green-400 font-mono text-sm whitespace-pre-wrap break-all">{result.decoded || result.error}</pre>
                  </div>
                )}
                {activeTool === 'defang' && (
                  <div>
                    <p className="text-xs text-gray-500 mb-1">Defanged Output:</p>
                    <pre className="text-green-400 font-mono text-sm whitespace-pre-wrap break-all">{result.defanged}</pre>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    };

    // Network Map Component
    const NetworkMap = ({ topology, onNodeClick, activeFilter }) => {
      if (!topology) return (
        <div className="flex flex-col items-center justify-center h-64 text-gray-500 border border-gray-700 rounded-lg bg-gray-900">
          <Activity size={48} className="mb-4 opacity-20" />
          <p>No network topology data available for this alert.</p>
        </div>
      );

      const { nodes, links } = topology;
      const getNode = (id) => nodes.find(n => n.id === id);

      return (
        <div className="bg-gray-900 border border-gray-700 rounded-lg p-4 h-[600px] relative overflow-hidden">
          <svg className="w-full h-full" viewBox="0 0 800 600">
            {/* Links */}
            {links.map((link, i) => {
              const source = getNode(link.source);
              const target = getNode(link.target);
              if (!source || !target) return null;
              return (
                <g key={i}>
                  <line x1={source.x} y1={source.y} x2={target.x} y2={target.y} stroke="#4b5563" strokeWidth="2" />
                  {link.label && (
                    <text x={(source.x + target.x) / 2} y={(source.y + target.y) / 2 - 10} fill="#9ca3af" fontSize="12" textAnchor="middle" className="bg-gray-900">{link.label}</text>
                  )}
                </g>
              );
            })}
            {/* Nodes */}
            {nodes.map((node) => {
              const isSelected = activeFilter && (node.ip === activeFilter || node.label === activeFilter);
              return (
              <g key={node.id} onClick={() => onNodeClick && onNodeClick(node)} className={`cursor-pointer transition-opacity ${activeFilter && !isSelected ? 'opacity-30' : 'hover:opacity-80'}`}>
                <circle cx={node.x} cy={node.y} r="24" 
                  fill={node.status === 'compromised' ? '#7f1d1d' : node.status === 'suspicious' ? '#7c2d12' : '#1e3a8a'} 
                  stroke={isSelected ? '#ffffff' : (node.status === 'compromised' ? '#ef4444' : node.status === 'suspicious' ? '#f97316' : '#3b82f6')} 
                  strokeWidth={isSelected ? "4" : "2"}
                />
                <text x={node.x} y={node.y + 6} textAnchor="middle" fill="white" fontSize="16">
                  {node.type === 'internet' ? '☁️' : node.type === 'firewall' ? '🛡️' : node.type === 'server' ? '🖥️' : '💻'}
                </text>
                <text x={node.x} y={node.y + 40} textAnchor="middle" fill="white" fontSize="14" fontWeight="bold">{node.label}</text>
                <text x={node.x} y={node.y + 55} textAnchor="middle" fill="#9ca3af" fontSize="10">{node.ip}</text>
              </g>
              );
            })}
          </svg>
          <div className="absolute bottom-4 right-4 bg-gray-800 p-3 rounded border border-gray-700 text-xs">
            <div className="flex items-center gap-2 mb-1"><div className="w-3 h-3 rounded-full bg-blue-900 border border-blue-500"></div> Normal</div>
            <div className="flex items-center gap-2 mb-1"><div className="w-3 h-3 rounded-full bg-orange-900 border border-orange-500"></div> Suspicious</div>
            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-red-900 border border-red-500"></div> Compromised</div>
          </div>
        </div>
      );
    };

    // KQL Editor Component
    const KQLEditor = ({ tables, onRunQuery }) => {
      const [query, setQuery] = useState('TimelineEvents\n| where event has "malware"\n| project time, event');
      const [results, setResults] = useState(null);
      const [error, setError] = useState(null);
      const [showSchema, setShowSchema] = useState(true);
      const [showHelp, setShowHelp] = useState(false);

      const handleRun = () => {
        setError(null);
        try {
          if (!tables) throw new Error("No data available to query.");
          
          const lines = query.split('\n').map(l => l.trim()).filter(l => l);
          
          if (lines.length === 0) throw new Error("Query is empty");
          
          const tableName = lines[0].trim().split(' ')[0].split('|')[0].trim();
          if (!tables[tableName]) {
             throw new Error(`Table '${tableName}' not found. Available: ${Object.keys(tables).join(', ')}`);
          }

          let currentData = [...tables[tableName]];

          for (let i = 1; i < lines.length; i++) {
            const line = lines[i];
            if (!line.startsWith('|')) continue;
            
            const part = line.substring(1).trim().toLowerCase(); // Normalize command to lowercase
            
            if (part.startsWith('where')) {
               const condition = part.substring(5).trim();
               if (condition.includes(' has ')) {
                 const [field, value] = condition.split(' has ').map(s => s.trim().replace(/['"]/g, ''));
                 currentData = currentData.filter(row => {
                    const rowVal = row[field] ? String(row[field]).toLowerCase() : '';
                    return rowVal.includes(value.toLowerCase());
                 });
               } else if (condition.includes(' contains ')) {
                 const [field, value] = condition.split(' contains ').map(s => s.trim().replace(/['"]/g, ''));
                 currentData = currentData.filter(row => {
                    const rowVal = row[field] ? String(row[field]).toLowerCase() : '';
                    return rowVal.includes(value.toLowerCase());
                 });
               } else if (condition.includes('==')) {
                  const [field, value] = condition.split('==').map(s => s.trim().replace(/['"]/g, ''));
                  // Case-insensitive field matching
                  const sampleRow = currentData[0] || {};
                  const actualField = Object.keys(sampleRow).find(k => k.toLowerCase() === field.toLowerCase()) || field;
                  currentData = currentData.filter(row => String(row[actualField]) == value);
               }
            } else if (part.startsWith('take') || part.startsWith('limit')) {
               const num = parseInt(part.split(/\s+/)[1]);
               if (!isNaN(num)) currentData = currentData.slice(0, num);
            } else if (part.startsWith('count')) {
               currentData = [{ Count: currentData.length }];
            } else if (part.startsWith('project')) {
               const fields = part.substring(7).split(',').map(s => s.trim());
               currentData = currentData.map(row => {
                 const newRow = {};
                 fields.forEach(f => { if (row[f] !== undefined) newRow[f] = row[f]; });
                 return newRow;
               });
            }
          }
          setResults(currentData);
          if (onRunQuery) onRunQuery();
        } catch (e) {
          setError(e.message);
          setResults(null);
        }
      };

      return (
        <div className="flex h-[600px] bg-gray-900 border border-gray-700 rounded-lg overflow-hidden">
           {/* Schema Sidebar */}
           {showSchema && (
             <div className="w-48 bg-gray-800 border-r border-gray-700 flex flex-col">
               <div className="p-2 border-b border-gray-700 font-bold text-xs text-gray-400 uppercase">Tables</div>
               <div className="flex-1 overflow-y-auto p-2 space-y-4">
                 {Object.keys(tables).map(tableName => (
                   <div key={tableName}>
                     <div className="text-cyan-400 text-xs font-bold mb-1 flex items-center gap-1">
                       <Database size={10} /> {tableName}
                     </div>
                     <div className="pl-2 space-y-0.5">
                       {tables[tableName].length > 0 && Object.keys(tables[tableName][0]).map(col => (
                         <div key={col} className="text-[10px] text-gray-500 font-mono">{col}</div>
                       ))}
                     </div>
                   </div>
                 ))}
               </div>
             </div>
           )}

           <div className="flex-1 flex flex-col min-w-0">
           <div className="bg-gray-800 p-2 border-b border-gray-700 flex justify-between items-center">
             <div className="flex items-center gap-2">
                <span className="text-xs font-bold text-gray-400">KQL Query Editor</span>
                <button onClick={() => setShowSchema(!showSchema)} className="text-[10px] text-blue-400 hover:text-white border border-blue-900 bg-blue-900/20 px-2 py-0.5 rounded">
                  {showSchema ? 'Hide Schema' : 'Show Schema'}
                </button>
                <button onClick={() => setShowHelp(!showHelp)} className="text-[10px] text-yellow-400 hover:text-white border border-yellow-900 bg-yellow-900/20 px-2 py-0.5 rounded">
                  {showHelp ? 'Hide Syntax' : 'Syntax Help'}
                </button>
             </div>
             <button onClick={handleRun} className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1 rounded text-xs font-bold flex items-center gap-1">
               ▶ Run Query
             </button>
           </div>
           {showHelp && (
             <div className="bg-gray-800 p-2 text-[10px] text-gray-400 border-b border-gray-700 grid grid-cols-2 gap-2">
               <div><code>| where Field == "Value"</code> - Exact match</div>
               <div><code>| where Field has "Value"</code> - Partial match</div>
               <div><code>| take 10</code> - Limit results</div>
               <div><code>| project Time, Event</code> - Select columns</div>
             </div>
           )}
           <textarea 
             value={query} 
             onChange={e => setQuery(e.target.value)}
             className="w-full h-32 bg-black text-green-400 font-mono text-sm p-4 focus:outline-none resize-none border-b border-gray-700"
             spellCheck="false"
             placeholder="TableName | where ..."
           />
           <div className="flex-1 bg-gray-900 overflow-auto p-0 relative">
             {error && <div className="p-4 text-red-400 font-mono text-sm bg-red-900/20 border-b border-red-900/50">Error: {error}</div>}
             {results ? (
               <table className="w-full text-left text-xs font-mono border-collapse">
                 <thead className="bg-gray-800 text-gray-400 sticky top-0 z-10">
                   <tr>
                     {results.length > 0 ? Object.keys(results[0]).map(k => <th key={k} className="p-2 border-b border-gray-700 font-semibold">{k}</th>) : <th className="p-2">Results</th>}
                   </tr>
                 </thead>
                 <tbody className="text-gray-300">
                   {results.length === 0 ? (
                     <tr><td className="p-4 text-gray-500 italic">No results found</td></tr>
                   ) : (
                     results.map((row, idx) => (
                       <tr key={idx} className="border-b border-gray-800 hover:bg-gray-800 transition-colors">
                         {Object.values(row).map((val, vIdx) => <td key={vIdx} className="p-2 truncate max-w-xs border-r border-gray-800 last:border-r-0">{typeof val === 'object' ? JSON.stringify(val) : String(val)}</td>)}
                       </tr>
                     ))
                   )}
                 </tbody>
               </table>
             ) : (
                <div className="flex flex-col items-center justify-center h-full text-gray-600">
                  <p className="mb-2">Run a query to view results</p>

    const HighlightedJSON = ({ data, filter }) => {
      if (!data) return null;
      const text = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
      if (!filter) return text;
      
      const parts = text.split(new RegExp(`(${filter.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')})`, 'gi'));
      return (
        <span>
          {parts.map((part, i) => part.toLowerCase() === filter.toLowerCase() ? <span key={i} className="bg-yellow-600 text-black font-bold">{part}</span> : part)}
        </span>
      );

      const handleAction = (action, alertId) => {
        const alert = alerts.find(a => a.id === alertId);
        const isCorrectAction = alert.correctAction === action;
        const currentTime = assessmentConfig.timeLimit - assessmentTime;
        
        // Update dwell time for the current alert to capture time until action
        setTelemetry(prev => {
          const currentDwell = prev.dwellTimes[alertId] || {};
          const startTime = currentDwell.start || currentTime;
          const addedTime = Math.max(0, currentTime - startTime);
          
          return {
            ...prev,
            dwellTimes: {
              ...prev.dwellTimes,
              [alertId]: { ...currentDwell, total: (currentDwell.total || 0) + addedTime, start: currentTime }
            }
          };
        });
        
        // Track first action time
        if (!telemetry.firstActionTime) {
          setTelemetry(prev => ({
            ...prev,
            firstActionTime: currentTime
          }));
        }
        
        // Track resolution sequence
        setTelemetry(prev => ({
          ...prev,
          resolutionSequence: [...prev.resolutionSequence, { alertId, action, time: currentTime }]
        }));
        
        // Mark alert as resolved regardless of correctness (no feedback to candidate)
        setAlerts(alerts.map(a => 
          a.id === alertId ? { ...a, status: 'Resolved', actionTaken: action, wasCorrect: isCorrectAction, resolutionTime: currentTime } : a
        ));
        
        addAuditEntry('Action Taken', `Resolved alert with action: ${action.toUpperCase()}`, alertId);
        
        // Generic success message without revealing correctness
        if (action === 'isolate') {
          showToast(`Host isolated - Alert resolved`, 'success');
        } else if (action === 'reset') {
          showToast(`Password reset initiated - Alert resolved`, 'success');
        } else if (action === 'close') {
          showToast(`Alert closed and documented`, 'success');
        }
        
        setTimeout(() => setSelectedAlert(null), 1500);

        // Track first alert opened
        if (!telemetry.firstAlertOpenedId) {
          setTelemetry(prev => ({
            ...prev,
            firstAlertOpenedId: alert.id,
            firstAlertOpenedTime: currentTime
          }));
        }
        
        // Track alerts viewed before first action
        if (!telemetry.firstActionTime && !telemetry.alertsViewedBeforeFirstAction.includes(alert.id)) {
          setTelemetry(prev => ({
            ...prev,
            alertsViewedBeforeFirstAction: [...prev.alertsViewedBeforeFirstAction, alert.id]
          }));
        }
        
        // Track context switches
        if (selectedAlert && selectedAlert.id !== alert.id) {
          setTelemetry(prev => ({
            ...prev,
            contextSwitches: prev.contextSwitches + 1
          }));
        }
        
        // Start tracking dwell time
        if (selectedAlert) {
          const dwellTime = currentTime - (telemetry.dwellTimes[selectedAlert.id]?.start || currentTime);
          setTelemetry(prev => ({
            ...prev,
            dwellTimes: {
              ...prev.dwellTimes,
              [selectedAlert.id]: {
                ...prev.dwellTimes[selectedAlert.id],
                total: (prev.dwellTimes[selectedAlert.id]?.total || 0) + dwellTime
              }
            }
          }));
        }
        
        setTelemetry(prev => ({
          ...prev,
          dwellTimes: {
            ...prev.dwellTimes,
            [alert.id]: {
              ...prev.dwellTimes[alert.id],
              start: currentTime
            }
          }
        }));

      const contactUser = (alertId) => {

        if (assessmentTime < costSeconds) {

      const calculateDetailedScore = () => {
        let totalScore = 0;
        let maxScore = 0;
        const breakdown = {};
        const activeAlerts = alerts.filter(a => assessmentConfig.enabledAlerts.includes(a.id));
        
        activeAlerts.forEach(alert => {
          let alertScore = 0;
          const alertMax = assessmentConfig.enableUserContact ? 100 : 90;
          const isResolved = alert.status === 'Resolved';
          
          let scoreCorrect = 0;
          let scoreEvidence = 0;
          let scoreVerif = 0;
          let scoreDoc = 0;

          // A. Correctness (40 pts)
          if (isResolved && alert.wasCorrect) scoreCorrect = 40;

          // Logs & Timing
          const alertLogs = telemetry.auditLog.filter(l => l.alertId === alert.id);
          const actionLog = alertLogs.find(l => l.action === 'Action Taken');
          const actionTime = actionLog ? actionLog.time : -1;

          // B. Investigation (30 pts) - Requested Extended Logs BEFORE action
          const evidenceLog = alertLogs.find(l => l.action === 'Evidence Request');
          if (evidenceLog && (actionTime === -1 || evidenceLog.time < actionTime)) scoreEvidence = 30;

          // C. Verification (10 pts) - Contacted User BEFORE action
          if (assessmentConfig.enableUserContact) {
            const contactLog = alertLogs.find(l => l.action === 'Contact User');
            if (contactLog && (actionTime === -1 || contactLog.time < actionTime)) scoreVerif = 10;
          }

          // D. Documentation (20 pts)
          const notes = alertNotes[alert.id] || {};
          if (notes.investigation && notes.investigation.length > 15) scoreDoc += 10;
          if (notes.reason && notes.reason.length > 15) scoreDoc += 10;

          alertScore = scoreCorrect + scoreEvidence + scoreVerif + scoreDoc;
          totalScore += alertScore;
          maxScore += alertMax;
          
          breakdown[alert.id] = {
            score: alertScore,
            max: alertMax,
            details: { correct: scoreCorrect, evidence: scoreEvidence, verification: scoreVerif, documentation: scoreDoc }
          };
        });

        let penalties = 0;
        const penaltyLog = [];

        // Prioritization Penalty: Resolving Low/Medium while Critical is Open
        const criticalAlerts = activeAlerts.filter(a => a.severity === 'Critical');
        if (criticalAlerts.length > 0) {
           telemetry.resolutionSequence.forEach(res => {
             const resolvedAlert = alerts.find(a => a.id === res.alertId);
             if (['Low', 'Medium'].includes(resolvedAlert.severity)) {
               const criticalOpen = criticalAlerts.some(crit => {
                 const critRes = telemetry.resolutionSequence.find(r => r.alertId === crit.id);
                 return !critRes || critRes.time > res.time;
               });
               
               if (criticalOpen) {
                 penalties += 10;
                 penaltyLog.push(`Resolved ${resolvedAlert.severity} alert "${resolvedAlert.title}" while Critical threats were active.`);
               }
             }
           });
        }
        
        // Critical Failure Penalty
        criticalAlerts.forEach(crit => {
           if (crit.status === 'Resolved' && !crit.wasCorrect) {
             penalties += 25;
             penaltyLog.push(`Incorrect resolution of Critical alert "${crit.title}".`);
           }
        });

        // Speeding Penalty
        activeAlerts.forEach(alert => {
           if (alert.status === 'Resolved') {
             const dwell = telemetry.dwellTimes[alert.id]?.total || 0;
             if (dwell < 15) {
               penalties += 10;
               penaltyLog.push(`Speeding: Resolved "${alert.title}" in ${Math.round(dwell)}s (min 15s).`);
             }
           }
        });

        const finalScore = Math.max(0, totalScore - penalties);
        const percentage = maxScore > 0 ? Math.round((finalScore / maxScore) * 100) : 0;

        return { rawScore: totalScore, penalties, penaltyLog, finalScore, maxScore, percentage, breakdown };

                  <div className="bg-gray-900 rounded-lg border border-gray-700 p-6 mb-6">
                    <h3 className="text-xl font-bold text-cyan-400 mb-4">Your Submitted Work</h3>
                    <p className="text-gray-400 mb-4">
                      Below is a summary of the alerts you worked on. Your responses have been saved and will be reviewed by our team.
                    </p>
                  </div>

                  {/* Alert Cards Carousel */}
                  <div className="space-y-6">
                    {alerts.filter(a => a.status === 'Resolved' && assessmentConfig.enabledAlerts.includes(a.id)).map(alert => (
                      <div key={alert.id} className="bg-gray-900 rounded-lg border border-gray-700 p-6">
                        <div className="flex items-start justify-between mb-4">
                          <div>
                            <h4 className="text-xl font-bold text-white mb-2">{alert.title}</h4>
                            <span className={`px-3 py-1 rounded text-sm font-bold ${getSeverityBadge(alert.severity)}`}>
                              {alert.severity}
                            </span>
                          </div>
                          <span className="px-3 py-1 bg-gray-700 text-gray-300 rounded text-sm font-semibold">
                            Action: {alert.actionTaken ? alert.actionTaken.toUpperCase() : 'None'}
                          </span>
                        </div>

                        <div className="space-y-4">
                          <div>
                            <h5 className="text-sm font-semibold text-gray-400 mb-2">Your Investigation:</h5>
                            <div className="bg-gray-800 rounded p-4 text-gray-300">
                              {alertNotes[alert.id]?.investigation || <em className="text-gray-500">No investigation notes provided</em>}
                            </div>
                          </div>

                          <div>
                            <h5 className="text-sm font-semibold text-gray-400 mb-2">Reason for Action:</h5>
                            <div className="bg-gray-800 rounded p-4 text-gray-300">
                              {alertNotes[alert.id]?.reason || <em className="text-gray-500">No reasoning provided</em>}
                            </div>
                          </div>

                          <div className="text-xs text-gray-500">
                            {telemetry.evidenceRequests[alert.id] ? '🔍 Extended forensic data was requested' : 'Basic logs reviewed'}
                          </div>
                        </div>
                      </div>
                    ))}

                    {alerts.filter(a => a.status === 'Open' && assessmentConfig.enabledAlerts.includes(a.id)).length > 0 && (
                      <div className="bg-gray-800 rounded-lg border border-gray-600 p-6">
                        <h4 className="text-lg font-bold text-gray-400 mb-2">Alerts Not Attempted</h4>
                        <ul className="list-disc list-inside text-gray-500">
                          {alerts.filter(a => a.status === 'Open' && assessmentConfig.enabledAlerts.includes(a.id)).map(alert => (
                            <li key={alert.id}>{alert.title}</li>
                          ))}
                        </ul>
                      </div>
                    )}
                  </div>

                  <div className="mt-8 flex justify-center gap-4">
                    <button
                      onClick={() => setShowReviewMode(true)}
                      className="px-6 py-3 bg-purple-600 hover:bg-purple-700 rounded font-bold text-white transition-colors flex items-center gap-2"
                    >
                      📖 Review Answers & Explanations
                    </button>
                    <button
                      onClick={() => setShowPasswordPrompt(true)}
                      className="px-6 py-3 bg-gray-700 hover:bg-gray-600 rounded font-bold text-white transition-colors flex items-center gap-2"
                    >
                      🔐 Interviewer Access
                    </button>
                  </div>
                </div>
              )}
              
              {showInterviewerDashboard && (
                <div className="max-w-6xl mx-auto">
                  {/* Navigation Back */}
                  <button
                    onClick={() => setShowInterviewerDashboard(false)}
                    className="mb-6 text-gray-400 hover:text-cyan-400 flex items-center gap-2 transition-colors"
                  >
                    ← Back to Candidate Summary
                  </button>

                  {/* Verdict Card */}
                  {(() => {
                    const scoreData = calculateDetailedScore();
                    const { percentage } = scoreData;
                    return (
                  <div className={`rounded-lg border-2 p-6 mb-6 ${
                    percentage >= 75 ? 'bg-green-900 border-green-500' :
                    percentage >= 50 ? 'bg-yellow-900 border-yellow-600' :
                    'bg-red-900 border-red-500'
                    }`}>
                      <h3 className="text-2xl font-bold text-white mb-2">
                        Assessment Score: {percentage}%
                      </h3>
                      <p className="text-lg">
                        Raw Points: {scoreData.rawScore} / {scoreData.maxScore} | Penalties: -{scoreData.penalties}
                      </p>
                      {scoreData.penaltyLog.length > 0 && (
                        <div className="mt-4 p-3 bg-black/30 rounded text-sm text-red-200">
                          <strong>Penalties Applied:</strong>
                          <ul className="list-disc list-inside mt-1">
                            {scoreData.penaltyLog.map((p, i) => <li key={i}>{p}</li>)}
                          </ul>
                        </div>
                      )}
                    </div>
                    );
                  })()}

                    {/* Score Summary */}
                    <div className="grid grid-cols-4 gap-4 mb-6">
                      <div className="bg-gray-900 border border-gray-700 rounded-lg p-4 text-center">
                        <div className="text-3xl font-bold text-green-400">{alerts.filter(a => a.wasCorrect).length}</div>
                        <div className="text-sm text-gray-400">Correct</div>
                      </div>
                      <div className="bg-gray-900 border border-gray-700 rounded-lg p-4 text-center">
                        <div className="text-3xl font-bold text-red-400">{alerts.filter(a => a.status === 'Resolved' && !a.wasCorrect).length}</div>
                        <div className="text-sm text-gray-400">Incorrect</div>
                      </div>
                      <div className="bg-gray-900 border border-gray-700 rounded-lg p-4 text-center">
                        <div className="text-3xl font-bold text-gray-400">{alerts.filter(a => a.status === 'Open').length}</div>
                        <div className="text-sm text-gray-400">Not Attempted</div>
                      </div>
                      <div className="bg-gray-900 border border-gray-700 rounded-lg p-4 text-center">
                        <div className="text-3xl font-bold text-cyan-400">{telemetry.contextSwitches}</div>
                        <div className="text-sm text-gray-400">Context Switches</div>
                      </div>
                    </div>

                    {/* Timeline */}
                    <div className="bg-gray-900 rounded-lg border border-gray-700 p-6 mb-6">
                      <h3 className="text-xl font-bold text-cyan-400 mb-4">Resolution Timeline</h3>
                      <div className="space-y-2">
                        {telemetry.resolutionSequence.map((item, idx) => {
                          const alert = alerts.find(a => a.id === item.alertId);
                          return (
                            <div key={idx} className="flex items-center gap-4 p-3 bg-gray-800 rounded">
                              <span className="text-gray-500 font-mono">{formatTime(assessmentConfig.timeLimit - item.time)}</span>
                              <span className={`px-2 py-1 rounded text-xs font-bold ${getSeverityBadge(alert.severity)}`}>
                                {alert.severity}
                              </span>
                              <span className="flex-1">{alert.title}</span>
                              <span className={`px-2 py-1 rounded text-xs ${
                                alert.wasCorrect ? 'bg-green-600' : 'bg-red-600'
                              }`}>
                                {item.action.toUpperCase()} {alert.wasCorrect ? '✓' : '✗'}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    {/* Teaching Moments */}
                    <div className="bg-orange-900 border border-orange-600 rounded-lg p-6 mb-6">
                      <h3 className="text-xl font-bold text-orange-200 mb-4">📚 Teaching Moments</h3>
                      <ul className="space-y-2">
                        {telemetry.firstAlertOpenedId !== 1 && (
                          <li className="text-orange-100">
                            • Started with {alerts.find(a => a.id === telemetry.firstAlertOpenedId)?.severity} severity alert instead of Critical. Always triage by severity first.
                          </li>
                        )}
                        {telemetry.contextSwitches > 15 && (
                          <li className="text-orange-100">
                            • {telemetry.contextSwitches} context switches detected. This suggests scattered focus. Try to fully investigate and resolve one alert before moving to the next.
                          </li>
                        )}
                        {Object.keys(telemetry.evidenceRequests).length === 0 && (
                          <li className="text-orange-100">
                            • Never requested extended logs. Real investigations require deep-diving into evidence, not just surface-level analysis.
                          </li>
                        )}
                        {telemetry.resolutionSequence.length > 0 && 
                         (() => {
                           const critIdx = telemetry.resolutionSequence.findIndex(r => r.alertId === 1);
                           const lowIdx = telemetry.resolutionSequence.findIndex(r => alerts.find(a => a.id === r.alertId)?.severity === 'Low');
                           return lowIdx !== -1 && (critIdx === -1 || lowIdx < critIdx);
                         })() && (
                          <li className="text-orange-100">
                            • Resolved Low severity alerts while Critical alerts remained open. This is a major prioritization failure in a real SOC.
                          </li>
                        )}
                        {telemetry.resolutionSequence.length === 0 && (
                          <li className="text-orange-100">
                            • No alerts were resolved. This suggests hesitation or inability to make decisions under pressure.
                          </li>
                        )}
                      </ul>
                    </div>

                    {/* Key Metrics */}
                    <div className="bg-gray-900 rounded-lg border border-gray-700 p-6">
                      <h3 className="text-xl font-bold text-cyan-400 mb-4">📊 Key Metrics</h3>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <span className="text-gray-400">First Alert Opened:</span>
                          <p className="font-semibold">{alerts.find(a => a.id === telemetry.firstAlertOpenedId)?.title || 'None'}</p>
                        </div>
                        <div>
                          <span className="text-gray-400">Time to First Action:</span>
                          <p className="font-semibold">{telemetry.firstActionTime ? formatTime(telemetry.firstActionTime) : 'No action taken'}</p>
                        </div>
                        <div>
                          <span className="text-gray-400">Alerts Reviewed Before Acting:</span>
                          <p className="font-semibold">{telemetry.alertsViewedBeforeFirstAction.length} / {assessmentConfig.enabledAlerts.length}</p>
                        </div>
                        <div>
                          <span className="text-gray-400">Extended Logs Requested:</span>
                          <p className="font-semibold">{Object.keys(telemetry.evidenceRequests).length} times</p>
                        </div>
                      </div>
                    </div>

                    {/* Detailed Audit Log (Collapsible) */}
                    <div className="bg-gray-900 rounded-lg border border-gray-700 p-6 mb-6">
                      <button
                        onClick={() => setIsAuditLogExpanded(!isAuditLogExpanded)}
                        className="w-full flex justify-between items-center text-xl font-bold text-cyan-400 focus:outline-none"
                      >
                        <div className="flex items-center gap-2">
                          <Clock size={24} /> Investigation Audit Log
                        </div>
                        <span>{isAuditLogExpanded ? '▼' : '▶'}</span>
                      </button>
                      
                      {isAuditLogExpanded && (
                        <div className="mt-6 space-y-0 relative border-l-2 border-gray-700 ml-3 pl-6">
                          {telemetry.auditLog.map((entry, idx) => {
                            const alert = alerts.find(a => a.id === entry.alertId);
                            return (
                              <div key={idx} className="mb-6 relative">
                                <div className={`absolute -left-[31px] top-0 w-4 h-4 rounded-full border-2 ${
                                  entry.action === 'Action Taken' ? 'bg-green-500 border-green-500' :
                                  entry.action === 'Tool Used' ? 'bg-purple-500 border-purple-500' :
                                  entry.action === 'Contact User' ? 'bg-blue-500 border-blue-500' :
                                  'bg-gray-900 border-gray-500'
                                }`}></div>
                                <div className="flex flex-col">
                                  <div className="flex items-center gap-2 mb-1">
                                    <span className="font-mono text-xs text-gray-500">{formatTime(entry.time)}</span>
                                    <span className="font-bold text-sm text-white">{entry.action}</span>
                                    {alert && <span className="text-xs px-2 py-0.5 rounded bg-gray-800 text-gray-400">{alert.title}</span>}
                                  </div>
                                  <p className="text-sm text-gray-400">{entry.details}</p>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                    
                    <div className="flex justify-end">
                      <button onClick={generateHTMLReport} className="px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded font-bold transition-colors flex items-center gap-2">
                        📄 Download HTML Report
                      </button>
                    </div>
                </div>
              )}
              </div>
            )}
        </div>
          {/* Knowledge Base Modal - Moved to end to ensure z-index stacking */}
          {showWiki && (
            <div className="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50" onClick={() => setShowWiki(false)}>
              <div className="bg-gray-900 rounded-lg border-2 border-cyan-500 p-8 max-w-2xl w-full max-h-[80vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-2xl font-bold text-cyan-400 flex items-center gap-2"><BookOpen size={28} /> Corporate Knowledge Base</h2>
                  <button onClick={() => setShowWiki(false)} className="text-gray-400 hover:text-white">✕</button>
                </div>
                <div className="space-y-6 text-gray-300">
                  <div className="border-l-4 border-red-500 pl-4 bg-gray-800 p-4 rounded-r">
                    <h3 className="text-lg font-bold text-white mb-1">SOP-001: Malware Containment</h3>
                    <p className="text-sm"><strong>Action:</strong> Immediate <span className="text-red-400 font-bold">ISOLATE HOST</span>.</p>
                  </div>
                  <div className="border-l-4 border-orange-500 pl-4 bg-gray-800 p-4 rounded-r">
                    <h3 className="text-lg font-bold text-white mb-1">SOP-002: Credential Compromise</h3>
                    <p className="text-sm"><strong>Action:</strong> <span className="text-orange-400 font-bold">RESET PASSWORD</span>.</p>
                  </div>
                </div>
              </div>
            </div>
          )}
        </>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SOCAnalystSimulator />);
  </script>
</body>
</html>
